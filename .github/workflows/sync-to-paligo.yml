name: Sync BearQ MDX to Paligo

on:
  push:
    branches:
      - master
    paths:
      - '_Astro Out/src/content/docs/**/*.mdx'

jobs:
  sync-to-paligo:
    name: Convert MDX and push to Paligo
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts

      # ── 4. Detect changed MDX files ───────────────────────────────────────
      - name: Detect changed MDX files
        id: changed-files
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '_Astro Out/src/content/docs/' | grep '\.mdx$' | tr '\n' ',')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed MDX files: $CHANGED"

      # ── 5. Verify Paligo credentials ─────────────────────────────────────
      - name: Verify Paligo auth
        env:
          PALIGO_API_TOKEN: ${{ secrets.PALIGO_API_TOKEN }}
          PALIGO_INSTANCE:  ${{ secrets.PALIGO_INSTANCE }}
          PALIGO_USERNAME:  ${{ secrets.PALIGO_USERNAME }}
        run: |
          echo "Secret lengths (safe - values not shown):"
          echo "  PALIGO_INSTANCE  length: ${#PALIGO_INSTANCE}"
          echo "  PALIGO_USERNAME  length: ${#PALIGO_USERNAME}"
          echo "  PALIGO_API_TOKEN length: ${#PALIGO_API_TOKEN}"
          echo "Instance URL will be: https://${PALIGO_INSTANCE}.paligoapp.com"
          echo "Username starts with: ${PALIGO_USERNAME:0:3}..."
          echo ""
          echo "Testing GET https://${PALIGO_INSTANCE}.paligoapp.com/api/v1/documents"
          curl -s -o /tmp/auth_test.json -w "HTTP status: %{http_code}\n" \
            -u "${PALIGO_USERNAME}:${PALIGO_API_TOKEN}" \
            -H "Accept: application/json" \
            "https://${PALIGO_INSTANCE}.paligoapp.com/api/v1/documents" || true
          echo "Response body:"
          cat /tmp/auth_test.json | head -c 500 || true

      # ── 6. Convert and push to Paligo ─────────────────────────────────────
      - name: Sync to Paligo
        if: steps.changed-files.outputs.files != ''
        env:
          PALIGO_API_TOKEN: ${{ secrets.PALIGO_API_TOKEN }}
          PALIGO_INSTANCE:  ${{ secrets.PALIGO_INSTANCE }}
          PALIGO_USERNAME:  ${{ secrets.PALIGO_USERNAME }}
          CHANGED_FILES:    ${{ steps.changed-files.outputs.files }}
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/sync.js

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Write summary
        if: always()
        run: |
          echo "### Paligo Sync" >> $GITHUB_STEP_SUMMARY
          echo "Files: ${{ steps.changed-files.outputs.files }}" >> $GITHUB_STEP_SUMMARY
